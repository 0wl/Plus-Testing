[logging]
Description = CMSG
PrintHeartBeat = 0

# Der standard logger, wenn keiner konfiguriert ist.
DefaultLogger   = stdout Error slog Warn

# Systemkritische Logger
MESSAGE_MAIN    = stdout Info
MESSAGE_CPU     = stdout Info
MESSAGE_LOGID   = stdout Info
mcp             = stdout Info slog Info
mcp.client      = stdout Warn slog Info
tsd.system.swdl = stdout Info slog Info
devinfo         = stdout Info
networking.core = stdout Info slog Info

# CMsg
cmsg.thread       = stdout Error slog All
cmsg.listener     = stdout Error slog All
cmsg.rec          = stdout Error slog All
cmsg.recaudio     = stdout Error slog All
cmsg.recdp        = stdout Error slog All
cmsg.recmedia     = stdout Error slog All
cmsg.recnav       = stdout Error slog All
cmsg.recphone     = stdout Error slog All
cmsg.recupd       = stdout Error slog All
cmsg.ercom        = stdout Error slog All
