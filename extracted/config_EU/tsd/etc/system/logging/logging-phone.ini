# Der standard logger, wenn keiner konfiguriert ist.
DefaultLogger   = slog Error

# Systemkritische Logger
MESSAGE_MAIN    = stdout Info
MESSAGE_CPU     = stdout Info
MESSAGE_LOGID   = stdout Info
