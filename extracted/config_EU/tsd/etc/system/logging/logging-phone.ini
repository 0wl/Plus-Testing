# log SW-Version=X073-2 HW-Version=X10 PartNum=5C0035680A
itr.main = slog Info

# tsd.mibstd2.system.wirelessadapter
tsd.asiptest   = slog All   stdout All
tsd.wladap     = slog Info
tsd.wladap.dbg = slog Info
tsd.wladap.io  = slog Info

# phone domain apps
BT        = slog Info
Phone     = slog Info
Messaging = slog Info
Organizer = slog Info
