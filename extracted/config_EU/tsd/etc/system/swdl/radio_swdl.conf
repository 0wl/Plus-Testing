
control create startup_control_j5_tx

application_watchdog start_delay=infinite reset_delay=infinite
defaultpriority 17
ipc connection tsd.persmaster.tx tsd.persmaster.rx

service J5e.MountJxe1
   command on -p24 mount_ifs -B 262144 -T -d -f /j9/j9.ifs -m /j9/
   logstdout mountjxe1
   autoterm yes

service J5e.MountJxe
   command on -p24 mount_ifs -B 262144 -d -T -f /tsd/hmi/tsd.mibstd2.hmi.ifs -m /
   requires executed J5e.MountJxe1
   logstdout mountjxe
   autoterm yes

service J5e.MountRadio
   command mount_ifs -B 262144 -d -T -f /tsd/bin/ifs/radio.ifs -m /
   requires executed J5e.MountJxe
   logstdout mountradio
   autostart yes
   autoterm yes

service J5e.DispMg
   servicecontrol create tsd.displaymgr.control
   memlimit 536870912
   client yes
   command /tsd/bin/displaymanager/tsd.mibstd2.system.displaymanager
   logstdout dispmg
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.system.displaymanager.conf

service J5e.PersMaster
   servicecontrol create tsd.pers.master.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 4194318
   client yes
   command /tsd/bin/persistence/tsd.mibstd2.persistence.master
   logstdout persmaster
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.persistence.master.conf

service J5e.J9/HMI
   memlimit 536870912
   workingdir /tsd/hmi
   envar LIBSEG SIGSEGV,SIGILL,SIGBUS,SIGABRT
   envar LD_LIBRARY_PATH /proc/boot:/tsd/hmi/ifs:/lib:/usr/lib:/lib/dll:/opt/lib:/usr/lib/graphics/jacinto5:/tsd/lib/common:/tsd/hmi
   envar SYSTEM_RUNMODE swdl
   command on -Xaps=System /bin/sh /tsd/hmi/runHMI.sh
   logstdout j9/hmi
   autostart yes
   requires J5e.PersMaster
   requires executed J5e.MountJxe
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/on.conf

service J5e.Keypanel
   servicecontrol create tsd.keypanel.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 3145742
   client yes
   command /tsd/bin/keypanel/tsd.mibstd2.keypanel -control=tsd.keypanel.control
   logstdout keypanel
   requires J5e.PersMaster
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.keypanel.conf

service J5e.USB
   memlimit 536870912
   envar TSD_CONN_COMMON_DEFAULT_APS_LAUNCH_PARTITION System
   envar TSD_USB_IOUSB_VERBOSITY_LEVEL 3
   envar LD_LIBRARY_PATH /tsd/lib/common:/tsd/lib/connectivitycommon
   envar TSD_USB_IOUSB_ENUM_THREAD_PRIO 27
   client yes
   command /tsd/bin/serviceusb/tsd.service.usb
   logstdout usb
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.service.usb.conf

service J5e.NetMgr
   servicecontrol create tsd.networking.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 3145731
   envar LD_LIBRARY_PATH /tsd/lib/common:/tsd/hmi:/tsd/lib/connectivitycommon
   client yes
   command /tsd/bin/networking/tsd.mibstd2.networking -control=tsd.networking.control -exp_asix
   logstdout netmgr
   requires J5e.USB
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.networking.conf

service J5e.Bap
   servicecontrol create tsd.mibstd2.bap.control
   memlimit 536870912
   client yes
   command /tsd/bin/bap/tsd.mibstd2.carcom.bap
   logstdout bap
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.carcom.bap.conf

service J5e.DSPStarter
   command /tsd/bin/system/tsd.mibstd2.imageloader -file=/tsd/dsp/tsd.mibstd2.system.main.j5.dsp.bs -type=dsp
   logstdout dspstarter
   autostart yes
   autoterm yes

service J5e.AudioMgr
   ipc connection tsd.mibstd2.audio.audioclient tsd.mibstd2.audio.audiomgr
   servicecontrol create tsd.audiomgr.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 2
   client yes
   command /tsd/bin/audio/tsd.mibstd2.audio.audiomgr -control=tsd.audiomgr.control
   logstdout audiomgr
   autostart yes
   requires J5e.PersMaster
   requires executed J5e.DSPStarter
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.audio.audiomgr.conf

service J5e.Police
   servicecontrol create tsd.police.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 14
   client yes
   command /tsd/bin/trustedservices/tsd.mibstd2.system.trustedservices
   logstdout police
   requires J5e.PersMaster
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.system.trustedservices.conf

service J5e.AudioService
   ipc connection tsd.audio.svc.stereo.user  tsd.audio.svc.stereo.service
   ipc connection tsd.audio.svc.mono1.user   tsd.audio.svc.mono1.service
   ipc connection tsd.audio.svc.mono1a.user  tsd.audio.svc.mono1a.service
   ipc connection tsd.audio.svc.mono2.user   tsd.audio.svc.mono2.service
   ipc connection tsd.audio.svc.mono3.user   tsd.audio.svc.mono3.service
   ipc connection tsd.audio.svc.mono4.user   tsd.audio.svc.mono4.service
   ipc connection tsd.audio.svc.mono4a.user  tsd.audio.svc.mono4a.service
   ipc connection tsd.audio.svc.mono5.user   tsd.audio.svc.mono5.service
   ipc connection tsd.audio.svc.control.user tsd.audio.svc.control.service
   ipc connection tsd.audio.svc.fs.user      tsd.audio.svc.fs.service
   ipc connection tsd.audio.svc.mic1.service tsd.audio.svc.mic1.user
   ipc connection tsd.audio.svc.mic2.service tsd.audio.svc.mic2.user
   ipc connection tsd.media.cdm.app1         tsd.media.cdm.driver1
   ipc connection tsd.media.cdm.app2         tsd.media.cdm.driver2
   ipc connection tsd.media.cdm.app3         tsd.media.cdm.driver3
   ipc connection tsd.audio.dsp.control.user tsd.audio.dsp.control.service
   servicecontrol create tsd.audiosvc.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 2
   client yes
   command /tsd/bin/audioservice/tsd.mibstd2.audio.service -control=tsd.audiosvc.control -eh=M30_MEDIA_EJECT_SEM -ih=M30_MEDIA_CDINSERT_SEM
   logstdout audioservice
   autostart yes
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.audio.service.conf

service J5e.Swap
   servicecontrol create tsd.swap.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 9437198
   client yes
   command /tsd/bin/swap/tsd.mibstd2.system.swap
   logstdout swap
   requires J5e.Police
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.system.swap.conf

service J5e.WLAdapter
   ipc connectionpair tsd.mibstd2.wirelessadapter.phone tsd.mibstd2.phone.wirelessadapter
   ipc connectionpair tsd.mibstd2.wirelessadapter.bluetooth tsd.mibstd2.bluetooth.wirelessadapter
   ipc connectionpair tsd.mibstd2.wirelessadapter.organizer tsd.mibstd2.organizer.wirelessadapter
   ipc connectionpair tsd.mibstd2.wirelessadapter.messaging tsd.mibstd2.messaging.wirelessadapter
   ipc connectionpair tsd.mibstd2.wirelessadapter.swdownload tsd.mibstd2.swdownload.wirelessadapter
   ipc connectionpair tsd.mibstd2.wirelessadapter.wlan tsd.mibstd2.wlan.wirelessadapter
   servicecontrol create tsd.wirelessadapter.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 2097155
   client yes
   command /tsd/bin/wirelessadapter/tsd.mibstd2.system.wirelessadapter.main -control=tsd.wirelessadapter.control
   logstdout wladapter
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.system.wirelessadapter.main.conf

service J5e.SwDL
   servicecontrol create tsd.swdl.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 8388622
   client yes
   command /tsd/bin/swdownload/tsd.mibstd2.system.swdownload
   logstdout swdl
   requires J5e.PersMaster
   requires J5e.Swap
   requires J5e.WLAdapter
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.system.swdownload.conf

service J5e.Debug
   servicecontrol create tsd.tools.debug.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 14
   client yes
   command /tsd/bin/debugtool/tsd.tools.debug
   logstdout debug
   autostart yes
   requires J5e.NetMgr
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.tools.debug.conf

service J5e.Testinterface
   servicecontrol create tsd.mibstd2.system.testinterface.control
   memlimit 536870912
   client yes
   command /tmp/tsd.mibstd2.system.testinterface -control=tsd.mibstd2.system.testinterface.control -ipport=1234
   command /tsd/bin/testinterface/tsd.mibstd2.system.testinterface -control=tsd.mibstd2.system.testinterface.control -ipport=1234
   logstdout testinterface
   autostart yes
   requires J5e.Debug
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.system.testinterface.conf

service J5e.Logging
   servicecontrol create tsd.logging.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 14
   client yes
   command /tsd/bin/logging/tsd.mibstd2.logging /tsd/etc/system/logging/logging.ini  -control=tsd.logging.control
   logstdout logging
   autostart yes
   requires J5e.Testinterface
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.logging.conf

service J5e.Itr
   servicecontrol create tsd.system.itr.control
   memlimit 536870912
   envar TSD_LOGDOMAIN 2097166
   client yes
   command /tsd/bin/itr/tsd.mibstd2.system.itr.main
   logstdout itr
   autostart yes
   requires J5e.Logging
   restart global 3
   envar TSD_COMMON_CONFIG /tsd/etc/system/swdl/tsd.mibstd2.system.itr.main.conf

service dsi.audio
   requires J5e.AudioMgr

service dsi.communication
   requires J5e.NetMgr

service dsi.root
   requires J5e.Bap
   requires J5e.DispMg
   requires J5e.Keypanel
   requires J5e.PersMaster

service dsi.swdl
   requires J5e.SwDL
   requires J5e.NetMgr

service dsi.tuner

service dsi.info

service dsi.diagnosis

service dsi.picturestore

service dsi.explorer

service dsi.post
   requires dsi.root

service dsi.stationdb

service dsi.early_apps
   requires dsi.root
   autostart yes

